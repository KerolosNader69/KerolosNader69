name: Refresh profile metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *" # daily
  push:
    branches: [main]
    paths:
      - "scripts/generate-metrics.mjs"
      - ".github/workflows/refresh-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate metric cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
        run: node scripts/generate-metrics.mjs

      - name: Commit refreshed cards
        run: |
          git add assets/metrics
          if git diff --cached --quiet; then
            echo "Metrics already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile metrics"
          git push

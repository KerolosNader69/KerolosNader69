    <ellipse cx="0" cy="2" rx="9" ry="20"/>
    <circle cx="0" cy="-17" r="7"/>
    <path d="M-6,-20 L-8,-31 L-2,-23 Z M6,-20 L8,-31 L2,-23 Z"/>
  </g></g></g>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Kerollos Nader — Gotham Night banner</title>
  <desc id="d">A night city skyline under a glowing yellow signal crossed by a flying bat, with the name Kerollos Nader below.</desc>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#FFD60A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disc" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFD60A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFD60A" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0f" stop-opacity="0"/>
      <stop offset="1" stop-color="#0b0b0f"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 5s ease-in-out infinite; transform-origin: 600px 150px; }
      .fly   { animation: fly 7s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
      @keyframes fly   { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-4px); } }
      @media (prefers-reduced-motion: reduce) { .pulse, .fly { animation: none; } }
    </style>
  </defs>

